<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系 · 莫门工作室</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="light-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
  </div>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="../index.html" class="logo">莫门工作室 <span class="logo-sub">⚡</span><span class="logo-en">Momentum Studio</span></a>
      <div class="nav-links">
        <a href="../index.html#about">关于</a>
        <a href="../pricing/index.html">服务报价</a>
        <a href="../portfolio/index.html">作品集</a>
        <a href="../notes/index.html">笔记</a>
        <a href="../team/index.html">开发团队</a>
        <a href="." style="color:#64ffda;">联系</a>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
    </div>
  </nav>

  <section class="section section-dark" style="padding-top:140px;">
    <div class="container">
      <div class="section-label">Contact</div>
      <h2 class="section-title">联系我</h2>
      <p class="section-sub">有需求？想合作？直接发消息</p>
      <div class="contact-grid">
        <div class="contact-info">
          <div class="contact-item">
            <span class="contact-icon">📱</span>
            <div>
              <div class="contact-label">闲鱼</div>
              <div class="contact-value">搜索「莫门工作室」或私信</div>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-icon">💬</span>
            <div>
              <div class="contact-label">微信</div>
              <div class="contact-value">私信获取</div>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-icon">✉️</span>
            <div>
              <div class="contact-label">邮箱</div>
              <div class="contact-value">私信获取</div>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-icon">⚡</span>
            <div>
              <div class="contact-label">响应时间</div>
              <div class="contact-value">白天 &lt; 10 分钟</div>
            </div>
          </div>
        </div>
        <div class="contact-cta-card">
          <h3>现在就开始？</h3>
          <p style="margin-bottom:24px;">留下你的需求，我免费评估方案和报价</p>
          <form class="contact-form" id="contactForm">
            <div class="form-row">
              <input type="text" class="form-input" id="formName" placeholder="你的称呼 *" required>
              <input type="text" class="form-input" id="formContact" placeholder="微信 / 电话 / 邮箱">
            </div>
            <textarea class="form-textarea" id="formMessage" placeholder="描述你的需求：想做什么、用什么技术、预算是多少？ *" rows="4" required></textarea>
            <div class="form-footer">
              <span class="form-hint">不挑单，小到脚本大到系统都接</span>
              <button type="submit" class="btn btn-primary form-submit">提交需求 →</button>
            </div>
          </form>
          <div class="form-success" id="formSuccess">
            <span class="form-success-icon">✅</span>
            <div>
              <strong>需求已提交！</strong>
              <p>我会在 24 小时内联系你，请留意微信/消息。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">莫门工作室 · Momentum Studio</div>
        <div class="footer-links">
          <a href="../index.html#about">关于</a>
          <a href="../pricing/index.html">服务报价</a>
          <a href="../portfolio/index.html">作品集</a>
          <a href="../notes/index.html">笔记</a>
          <a href="../team/index.html">开发团队</a>
          <a href=".">联系</a>
        </div>
        <div class="footer-copy">© 2026 莫门工作室 · 用代码解决问题</div>
      </div>
    </div>
  </footer>

  <script src="../assets/main.js"></script>
</body>
</html>
