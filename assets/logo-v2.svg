<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64ffda"/>
      <stop offset="100%" style="stop-color:#48c6ef"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="300" rx="20" fill="#0a0a0f"/>
  
  <!-- === C: 简洁双线 M === -->
  <path d="M 50,200 L 80,80 L 110,200" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80,200 L 110,80 L 140,200" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <text x="150" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#fff">莫门工作室</text>

  <!-- === D: 字母标 === -->
  <line x1="300" y1="20" x2="300" y2="280" stroke="rgba(255,255,255,0.05)"/>
  
  <circle cx="370" cy="110" r="45" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <text x="370" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="900" fill="url(#g)">M</text>
  <text x="370" y="205" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#fff">莫门工作室</text>
  <text x="370" y="230" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.3)" letter-spacing="4">MOMENTUM</text>

  <!-- === E: 箭头加速 === -->
  <line x1="480" y1="20" x2="480" y2="280" stroke="rgba(255,255,255,0.05)"/>
  
  <path d="M 460,130 L 510,90 L 560,130" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 460,150 L 530,150 L 530,130" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <text x="510" y="205" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#fff">莫门工作室</text>
  <text x="510" y="230" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.3)" letter-spacing="4">MOMENTUM</text>
</svg>
