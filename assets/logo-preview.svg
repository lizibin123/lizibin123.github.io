<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64ffda"/>
      <stop offset="100%" style="stop-color:#48c6ef"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64ffda"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="300" rx="20" fill="#0a0a0f"/>
  
  <!-- 方案 A：几何 M + 闪电剪影 -->
  
  <!-- M 主体结构 — 三条竖线+两个V -->
  <polygon points="65,220 90,80 120,150 150,80 175,220" fill="none" stroke="url(#main)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 右下角闪电 -->
  <polygon points="155,180 185,195 175,215 200,230" fill="url(#accent)" opacity="0.9"/>
  
  <!-- 文字 -->
  <text x="150" y="270" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#fff">莫门工作室</text>

  <!-- ================== 方案 B ================== -->
  
  <line x1="300" y1="20" x2="300" y2="280" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- 几何六边形 + M -->
  <rect x="320" y="50" width="100" height="100" rx="16" fill="none" stroke="url(#main)" stroke-width="3" transform="rotate(45, 370, 100)"/>
  <text x="370" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="url(#main)">M</text>
  
  <!-- 三个加速条 -->
  <line x1="440" y1="70" x2="490" y2="70" stroke="url(#main)" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="90" x2="470" y2="90" stroke="url(#main)" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="110" x2="450" y2="110" stroke="url(#main)" stroke-width="4" stroke-linecap="round"/>
  
  <text x="445" y="195" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#fff">莫门工作室</text>
  <text x="445" y="220" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.3)" letter-spacing="3">MOMENTUM STUDIO</text>
</svg>
