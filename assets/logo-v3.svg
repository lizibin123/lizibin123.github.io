<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64ffda"/>
      <stop offset="100%" style="stop-color:#48c6ef"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" rx="20" fill="#0a0a0f"/>
  
  <!-- F: 斜线M + 底部文字 — 最简 -->
  <text x="150" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="90" font-weight="900" fill="url(#g)" letter-spacing="-4">M</text>
  <text x="150" y="250" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#fff" letter-spacing="6">莫门工作室</text>
  <text x="150" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.2)" letter-spacing="4">MOMENTUM STUDIO</text>

  <line x1="300" y1="20" x2="300" y2="280" stroke="rgba(255,255,255,0.05)"/>

  <!-- G: 重叠圆 -->
  <circle cx="450" cy="130" r="30" fill="none" stroke="url(#g)" stroke-width="2"/>
  <circle cx="472" cy="130" r="30" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
  <circle cx="494" cy="130" r="30" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.2"/>
  <text x="450" y="205" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#fff" letter-spacing="6">莫门工作室</text>
  <text x="450" y="225" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.2)" letter-spacing="4">MOMENTUM</text>
</svg>
